<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HP BIOS 仿真制作工具</title>
    <link rel="stylesheet" href="../css/layout.css">
</head>

<body>
    <container class="ly-container">
        <nav class="ly-nav">
            <ul class="nav-menu">
                <li>
                    <p class="label">机型：</p>
                    <p class="value"></p>
                    <ul class="oprion-list">
                        <li>选项1</li>
                        <li>选项2</li>

                    </ul>
                </li>
            </ul>
        </nav>
        <main class="ly-main">
            <div class="ly-content">
                <div class="drawer-box ">
                    <div class="record-frame">
                        <div class="corner corner-tl"></div>
                        <div class="corner corner-tr"></div>
                        <div class="corner corner-bl"></div>
                        <div class="corner corner-br"></div>
                        <div class="drawer-view">
                            <div class="drawer" id="drawer"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="ly-aside">
                <ul class="tab-nav" id="tabBox">
                    <li class="tab-active">元件</li>
                    <li>选项</li>
                </ul>
                <div class="tab-box">
                    <div class="unit-box tab-active">
                        <ul class="unit-menu" id="unitMenu">
                            <li>
                                <p class="unit-menu-list-title">菜单</p>
                                <ul class="unit-menu-list">
                                    <li>
                                        <p>添加选项</p>
                                    </li>
                                    <li>
                                        <p>添加计数器</p>
                                    </li>

                            </li>
                            <li>
                                <p class="unit-menu-list-title">标题1</p>

                                <ul class="unit-menu-list">
                                    <li>
                                        <p>按钮</p>
                                    </li>
                                    <li>
                                        <p>按钮</p>
                                    </li>
                                </ul>
                            </li>
                            <li>
                                <ul class="unit-menu-list">
                                    <li>
                                        <p>按钮</p>
                                    </li>
                                    <li>
                                        <p>按钮</p>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                    <div class="options-box"></div>
                </div>
            </div>
        </main>
    </container>
</body>

</html>
